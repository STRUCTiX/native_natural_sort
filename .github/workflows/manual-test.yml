name: Manual Test

on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Run Android (Kotlin unit) tests'
        type: boolean
        default: true
      ios:
        description: 'Run iOS integration tests (requires macOS + simulator)'
        type: boolean
        default: true
      linux:
        description: 'Run Linux native + integration tests'
        type: boolean
        default: true
      macos:
        description: 'Run macOS integration tests'
        type: boolean
        default: true
      windows:
        description: 'Run Windows native + integration tests'
        type: boolean
        default: true
      web:
        description: 'Run Web (Chrome) tests'
        type: boolean
        default: true

jobs:
  testing:
    name: Test
    uses: ./.github/workflows/_test.yml
    with:
      android: ${{ inputs.android }}
      ios: ${{ inputs.ios }}
      linux: ${{ inputs.linux }}
      macos: ${{ inputs.macos }}
      windows: ${{ inputs.windows }}
      web: ${{ inputs.web }}
